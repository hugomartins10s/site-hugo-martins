# Publica a homologação em https://hugomartins10s.github.io/site-hugo-martins/
# A build de homologação sai com noindex em todas as páginas e robots.txt com Disallow.
name: Deploy homologação (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 24
          build-cmd: npm run build:homologacao
        env:
          SITE_URL: https://hugomartins10s.github.io
          BASE_PATH: /site-hugo-martins

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
